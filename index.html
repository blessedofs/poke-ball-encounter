<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Big Hit Society | Poké Ball Encounter</title>

  <style>
    :root{
      --ink:#111827;
      --yellow:#facc15;
      --red:#ef4444;
      --blue:#2563eb;
      --green:#10b981;
      --card:#ffffff;
      --muted:#6b7280;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
      color:white;
      background:
        radial-gradient(circle at 20% 20%, rgba(37,99,235,.35), transparent 32%),
        radial-gradient(circle at 80% 10%, rgba(239,68,68,.28), transparent 30%),
        linear-gradient(160deg,#0f172a,#1f2937);
    }

    .wrap{
      width:min(460px,100%);
    }

    .brand{
      text-align:center;
      font-weight:1000;
      letter-spacing:.17em;
      font-size:.8rem;
      color:var(--yellow);
      margin-bottom:8px;
    }

    .card{
      background:var(--card);
      color:var(--ink);
      border-radius:28px;
      padding:22px;
      box-shadow:0 24px 70px rgba(0,0,0,.35);
      overflow:hidden;
      position:relative;
    }

    h1{
      margin:0;
      text-align:center;
      font-size:clamp(1.7rem,6vw,2.25rem);
      line-height:1.05;
    }

    .sub{
      text-align:center;
      color:var(--muted);
      margin:8px 0 15px;
    }

    .stage{
      position:relative;
      min-height:410px;
      border-radius:24px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 50% 70%, rgba(255,255,255,.95) 0 12%, transparent 13%),
        linear-gradient(#93c5fd 0 52%, #86efac 52% 100%);
      border:4px solid #2563eb;
    }

    .cloud{
      position:absolute;
      width:110px;
      height:34px;
      background:rgba(255,255,255,.75);
      border-radius:999px;
      top:42px;
      left:25px;
      filter:blur(.2px);
    }
    .cloud:before,.cloud:after{
      content:"";
      position:absolute;
      background:inherit;
      border-radius:50%;
    }
    .cloud:before{width:45px;height:45px;left:18px;top:-20px;}
    .cloud:after{width:55px;height:55px;left:48px;top:-28px;}

    .cloud.two{
      left:auto;
      right:22px;
      top:88px;
      transform:scale(.75);
    }

    #pokemonImage{
      position:absolute;
      width:245px;
      height:245px;
      object-fit:contain;
      top:80px;
      filter:drop-shadow(0 14px 10px rgba(0,0,0,.25));
      transition:opacity .3s ease, transform .3s ease;
    }

    .encounterLabel{
      position:absolute;
      top:12px;
      left:12px;
      padding:7px 10px;
      border-radius:999px;
      font-size:.72rem;
      font-weight:1000;
      letter-spacing:.06em;
      background:#111827;
      color:white;
      z-index:3;
    }

    .ballWrap{
      position:absolute;
      bottom:38px;
      display:flex;
      justify-content:center;
      width:100%;
      z-index:5;
    }

    .ball{
      width:102px;
      height:102px;
      border-radius:50%;
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(to bottom,
          #ef4444 0 44%,
          #111827 44% 56%,
          #f8fafc 56% 100%);
      border:5px solid #111827;
      box-shadow:0 12px 18px rgba(0,0,0,.25);
      transform-origin:50% 100%;
    }

    .ball:after{
      content:"";
      position:absolute;
      width:30px;
      height:30px;
      border-radius:50%;
      background:#fff;
      border:6px solid #111827;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      box-shadow:inset 0 0 0 3px #d1d5db;
    }

    .ball.throwing{
      animation:throwBall 1s ease-in forwards;
    }

    .ball.shake{
      animation:shakeBall .38s ease-in-out;
    }

    @keyframes throwBall{
      0%{transform:translateY(0) scale(1)}
      45%{transform:translateY(-220px) scale(.72) rotate(-280deg)}
      100%{transform:translateY(-110px) scale(.82) rotate(-360deg)}
    }

    @keyframes shakeBall{
      0%,100%{transform:translateY(-110px) rotate(0)}
      25%{transform:translateY(-110px) rotate(-18deg)}
      75%{transform:translateY(-110px) rotate(18deg)}
    }

    .flash{
      position:absolute;
      inset:0;
      background:white;
      opacity:0;
      pointer-events:none;
      z-index:4;
    }

    .flash.go{
      animation:flash .45s ease;
    }

    @keyframes flash{
      0%{opacity:0}
      40%{opacity:.92}
      100%{opacity:0}
    }

    .result{
      display:none;
      text-align:center;
      margin-top:14px;
    }

    .result .name{
      text-transform:capitalize;
      font-size:1.9rem;
      font-weight:1000;
      margin:0;
    }

    .result .meta{
      color:var(--muted);
      font-weight:800;
      margin-top:4px;
    }

    .buttons{
      display:grid;
      gap:10px;
      margin-top:16px;
    }

    button{
      width:100%;
      border:0;
      border-radius:16px;
      padding:15px 16px;
      font-size:1rem;
      font-weight:1000;
      cursor:pointer;
      transition:transform .12s ease, opacity .2s ease;
    }

    button:active{transform:scale(.98)}

    #throwBtn{
      background:var(--yellow);
      color:#111827;
    }

    #newBtn{
      display:none;
      background:#111827;
      color:white;
    }

    #soundBtn{
      background:#e5e7eb;
      color:#111827;
    }

    .status{
      position:absolute;
      bottom:10px;
      width:100%;
      text-align:center;
      font-size:.9rem;
      font-weight:1000;
      color:#111827;
      text-shadow:0 1px 0 rgba(255,255,255,.7);
      z-index:6;
    }

    .footer{
      text-align:center;
      font-size:.74rem;
      color:#d1d5db;
      margin-top:10px;
      line-height:1.35;
    }

    .loading{
      position:absolute;
      inset:0;
      display:none;
      place-items:center;
      background:rgba(255,255,255,.82);
      z-index:20;
      color:#111827;
      font-weight:1000;
    }

    .sparkles{
      position:fixed;
      inset:0;
      pointer-events:none;
      display:none;
      place-items:center;
      font-size:3.4rem;
      z-index:50;
      animation:pop .8s ease;
    }

    @keyframes pop{
      0%{transform:scale(.4);opacity:0}
      45%{transform:scale(1.3);opacity:1}
      100%{transform:scale(1);opacity:0}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="brand">BIG HIT SOCIETY</div>

    <main class="card">
      <h1>WILD ENCOUNTER!</h1>
      <p class="sub">A wild Pokémon appeared. Throw the ball and see who you caught.</p>

      <section class="stage">
        <div class="cloud"></div>
        <div class="cloud two"></div>
        <div class="encounterLabel" id="rarityBadge">WILD ENCOUNTER</div>

        <img id="pokemonImage" alt="Wild Pokémon" />

        <div class="ballWrap">
          <div class="ball" id="ball"></div>
        </div>

        <div class="flash" id="flash"></div>
        <div class="status" id="status">READY TO THROW</div>
        <div class="loading" id="loading">Searching for a wild Pokémon…</div>
      </section>

      <section class="result" id="result">
        <p class="name" id="pokemonName"></p>
        <div class="meta" id="pokemonMeta"></div>
      </section>

      <div class="buttons">
        <button id="throwBtn">🔴 THROW BALL!</button>
        <button id="newBtn">🔄 NEW ENCOUNTER</button>
        <button id="soundBtn">🔊 Sound: ON</button>
      </div>
    </main>

    <div class="footer">
      Fan-made Big Hit Society experience. Pokémon names and artwork belong to their respective rights holders.
    </div>
  </div>

  <div class="sparkles" id="sparkles">✨⚡✨</div>

<script>
  const MAX_POKEMON = 1025;
  let currentPokemon = null;
  let busy = false;
  let soundOn = true;

  const rarityTable = [
    {name:"COMMON", weight:68, ranges:[[1,1025]]},
    {name:"RARE", weight:22, ids:[6,9,18,65,94,130,131,143,149,212,248,282,306,330,350,376,445,448,468,475,635,706,784,887,937,998]},
    {name:"ULTRA RARE", weight:8, ids:[3,6,9,26,94,130,149,150,151,248,249,250,376,382,383,384,445,448,493,643,644,646,716,717,718,791,792,800,888,889,890,1007,1008]},
    {name:"SECRET", weight:2, ids:[25,6,94,130,149,150,151,249,250,384,493,700,791,792,800,1007,1008]}
  ];

  function weightedRarity(){
    const roll = Math.random() * 100;
    let cursor = 0;
    for(const tier of rarityTable){
      cursor += tier.weight;
      if(roll <= cursor) return tier;
    }
    return rarityTable[0];
  }

  function pickId(tier){
    if(tier.ids && tier.ids.length){
      return tier.ids[Math.floor(Math.random()*tier.ids.length)];
    }
    const [min,max] = tier.ranges[0];
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function beep(freq=440, duration=.1){
    if(!soundOn) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(.045, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  function wait(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
  }

  async function newEncounter(){
    if(busy) return;

    const loading = document.getElementById("loading");
    const img = document.getElementById("pokemonImage");
    const result = document.getElementById("result");
    const throwBtn = document.getElementById("throwBtn");
    const newBtn = document.getElementById("newBtn");
    const ball = document.getElementById("ball");
    const status = document.getElementById("status");
    const badge = document.getElementById("rarityBadge");

    loading.style.display = "grid";
    result.style.display = "none";
    throwBtn.style.display = "block";
    newBtn.style.display = "none";
    ball.className = "ball";
    ball.style.transform = "";
    img.style.opacity = "1";
    img.style.transform = "scale(1)";
    status.textContent = "READY TO THROW";
    badge.textContent = "WILD ENCOUNTER";

    try{
      const tier = weightedRarity();
      const id = pickId(tier);

      const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
      if(!response.ok) throw new Error("API error");

      const pokemon = await response.json();

      const shiny = Math.random() < 0.02;
      const artwork = shiny
        ? pokemon.sprites.other["official-artwork"].front_shiny
        : pokemon.sprites.other["official-artwork"].front_default;

      currentPokemon = {
        ...pokemon,
        encounterRarity:tier.name,
        shiny
      };

      img.src = artwork || pokemon.sprites.front_default;
      img.alt = pokemon.name;
      beep(330,.08);

    }catch(e){
      console.error(e);
      status.textContent = "CONNECTION ERROR";
      throwBtn.style.display = "none";
      newBtn.style.display = "block";
    }finally{
      loading.style.display = "none";
    }
  }

  async function throwBall(){
    if(busy || !currentPokemon) return;
    busy = true;

    const ball = document.getElementById("ball");
    const flash = document.getElementById("flash");
    const img = document.getElementById("pokemonImage");
    const status = document.getElementById("status");
    const throwBtn = document.getElementById("throwBtn");
    const newBtn = document.getElementById("newBtn");
    const result = document.getElementById("result");
    const name = document.getElementById("pokemonName");
    const meta = document.getElementById("pokemonMeta");
    const badge = document.getElementById("rarityBadge");
    const sparkles = document.getElementById("sparkles");

    throwBtn.disabled = true;
    status.textContent = "THROW!";
    ball.className = "ball throwing";
    beep(620,.09);

    await wait(900);

    flash.classList.add("go");
    img.style.opacity = "0";
    beep(760,.08);
    await wait(430);
    flash.classList.remove("go");

    ball.className = "ball";
    ball.style.transform = "translateY(-110px) scale(.82)";

    for(let i=1;i<=3;i++){
      status.textContent = `${i}...`;
      ball.className = "ball shake";
      beep(430 + i*55,.08);
      await wait(390);
      ball.className = "ball";
      ball.style.transform = "translateY(-110px) scale(.82)";
      await wait(280);
    }

    status.textContent = "CAUGHT!";
    beep(620,.1);
    setTimeout(()=>beep(780,.1),110);
    setTimeout(()=>beep(930,.18),220);

    const prettyName = currentPokemon.name.replaceAll("-", " ");

    name.textContent = currentPokemon.shiny
      ? `✨ SHINY ${prettyName}!`
      : `You caught ${prettyName}!`;

    meta.textContent =
      `Pokédex #${currentPokemon.id} • ${currentPokemon.encounterRarity}`;

    badge.textContent = currentPokemon.shiny
      ? `✨ SHINY • ${currentPokemon.encounterRarity}`
      : currentPokemon.encounterRarity;

    result.style.display = "block";
    throwBtn.style.display = "none";
    newBtn.style.display = "block";
    throwBtn.disabled = false;

    sparkles.style.display = "grid";
    setTimeout(()=>sparkles.style.display="none",800);

    busy = false;
  }

  document.getElementById("throwBtn").addEventListener("click", throwBall);
  document.getElementById("newBtn").addEventListener("click", newEncounter);

  document.getElementById("soundBtn").addEventListener("click", e=>{
    soundOn = !soundOn;
    e.target.textContent = soundOn ? "🔊 Sound: ON" : "🔇 Sound: OFF";
    if(soundOn) beep(600,.08);
  });

  newEncounter();
</script>
</body>
</html>
